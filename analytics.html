<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Tracker | Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#bdbbdd,#7C3AED,#b1d8df);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.dashboard{

    width:1200px;
    height:700px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:30px;

    display:grid;
    grid-template-columns:260px 1fr;

    overflow:hidden;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

}

/* SIDEBAR */

.sidebar{

    background:rgba(255,255,255,.08);

    padding:40px 30px;

    color:white;

}

.logo{

    font-size:30px;

    font-weight:700;

    margin-bottom:50px;

}

.menu{

    list-style:none;

}

.menu li{

    margin-bottom:15px;

}

.menu a{

    display:block;

    text-decoration:none;

    color:white;

    padding:15px 20px;

    border-radius:15px;

    transition:.3s;

}

.menu a:hover{

    background:rgba(255,255,255,.15);

    transform:translateX(8px);

}

.active a{

    background:rgba(255,255,255,.25);

}

/* MAIN */

.main{

    background:#f8fafc;

    padding:35px;

    overflow:auto;

}

/* NAVBAR */

.navbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;

}

.navbar h1{

    color:#1E293B;

}

.profile{

    width:55px;

    height:55px;

    border-radius:50%;

    object-fit:cover;

}

/* SUMMARY CARDS */

.cards{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;

    margin-bottom:30px;

}

.card{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.card h4{

    color:#64748B;

    margin-bottom:10px;

}

.card h2{

    font-size:30px;

}

.income{

    color:#10B981;

}

.expense{

    color:#EF4444;

}

.balance{

    color:#4F46E5;

}

/* CHARTS */

.chart-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

.chart-card{

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.chart-card h3{

    margin-bottom:20px;

    color:#1E293B;

}

canvas{

    width:100% !important;

    height:300px !important;

}

</style>

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

FINTECH

</div>

<ul class="menu">

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="transactions.html">Transactions</a></li>

<li class="active"><a href="analytics.html">Analytics</a></li>

<li><a href="budgets.html">Budgets</a></li>

<li><a href="settings.html">Settings</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main">

<div class="navbar">

<h1>Analytics</h1>

<img src="khusu.jpg" class="profile">

</div>

<!-- Summary -->

<div class="cards">

<div class="card">

<h4>Total Income</h4>

<h2 class="income" id="income">$0</h2>

</div>

<div class="card">

<h4>Total Expenses</h4>

<h2 class="expense" id="expense">$0</h2>

</div>

<div class="card">

<h4>Current Balance</h4>

<h2 class="balance" id="balance">$0</h2>

</div>

</div>

<!-- Charts -->

<div class="chart-grid">

<div class="chart-card">

<h3>Income vs Expenses</h3>

<canvas id="pieChart"></canvas>

</div>

<div class="chart-card">

<h3>Transactions Overview</h3>

<canvas id="barChart"></canvas>

</div>

</div>

</main>

</div>

<script src="analytics.js"></script>

</body>
</html>
