<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions | Finance Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#bdbbdd,#7C3AED,#b1d8df);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.dashboard{
    width:1200px;
    height:700px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    display:grid;
    grid-template-columns:260px 1fr;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

/* Sidebar */

.sidebar{
    background:rgba(255,255,255,.08);
    padding:40px 30px;
    color:white;
}

.logo{
    font-size:30px;
    font-weight:700;
    margin-bottom:50px;
    color:white;
}

.menu{
    list-style:none;
}

.menu li{
    margin-bottom:15px;
}

.menu a{
    display:block;
    text-decoration:none;
    color:white;
    padding:15px 20px;
    border-radius:15px;
    transition:.3s;
}

.menu a:hover{
    background:rgba(255,255,255,.15);
    transform:translateX(8px);
}

.active a{
    background:#ffffff33;
}

/* Main */

.main{
    background:#f8fafc;
    padding:35px;
    overflow:auto;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.navbar h1{
    color:#1E293B;
}

.profile{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
}

/* Top Bar */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.search{
    width:280px;
    padding:12px;
    border:none;
    outline:none;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.add-btn{
    border:none;
    background:#4F46E5;
    color:white;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.add-btn:hover{
    background:#4338CA;
}

/* Filters */

.filters{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.filters select{
    padding:12px;
    border:none;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* Table */

.table-container{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:#64748B;
    padding:15px;
    border-bottom:2px solid #eee;
}

td{
    padding:18px 15px;
    border-bottom:1px solid #eee;
}

.income{
    color:#10B981;
    font-weight:600;
}

.expense{
    color:#EF4444;
    font-weight:600;
}

.edit{
    background:#FACC15;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.delete{
    background:#EF4444;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-left:8px;
}

.edit:hover{
    opacity:.85;
}

.delete:hover{
    opacity:.85;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
}

.modal-content h2{
    margin-bottom:20px;
    color:#4F46E5;
}

.modal-content input,
.modal-content select{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    background:#4F46E5;
    color:white;
    border-radius:12px;
    cursor:pointer;
}

.save-btn:hover{
    background:#4338CA;
}

</style>
</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<div class="logo">FINTECH</div>

<ul class="menu">
<li><a href="dashboard.html">Dashboard</a></li>
<li class="active"><a href="transactions.html">Transactions</a></li>
<li><a href="analytics.html">Analytics</a></li>
<li><a href="budgets.html">Budgets</a></li>
<li><a href="settings.html">Settings</a></li>
</ul>

</aside>

<main class="main">

<div class="navbar">

<h1>Transactions</h1>

<img src="khusu.jpg" class="profile">

</div>

<div class="top-bar">

<input
type="text"
class="search"
placeholder="Search transaction...">

<button class="add-btn" id="addTransactionBtn">
+ Add Transaction
</button>

</div>

<div class="filters">

<select>
<option>All Categories</option>
<option>Food</option>
<option>Shopping</option>
<option>Salary</option>
<option>Travel</option>
</select>

<select>
<option>All Types</option>
<option>Income</option>
<option>Expense</option>
</select>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Name</th>
<th>Category</th>
<th>Type</th>
<th>Date</th>
<th>Amount</th>
<th>Action</th>

</tr>

</thead>

<tbody id="transactionTable">

<tr>

<td>Coffee</td>
<td>Food</td>
<td>Expense</td>
<td>29 Jul 2026</td>
<td class="expense">-$8</td>

<td>

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</td>

</tr>

<tr>

<td>Salary</td>
<td>Income</td>
<td>Income</td>
<td>28 Jul 2026</td>
<td class="income">+$900</td>

<td>

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</td>

</tr>

</tbody>

</table>

</div>

</main>

</div>

<!-- Add Transaction Modal -->

<div class="modal" id="transactionModal">

<div class="modal-content">

<h2>Add Transaction</h2>

<input type="text" id="name" placeholder="Transaction Name">

<select id="category">
<option>Food</option>
<option>Shopping</option>
<option>Salary</option>
<option>Travel</option>
<option>Bills</option>
</select>

<select id="type">
<option>Income</option>
<option>Expense</option>
</select>

<input type="number" id="amount" placeholder="Amount">

<input type="date" id="date">

<button class="save-btn" id="saveTransaction">
Save Transaction
</button>

</div>

</div>

<script src="transactions.js"></script>

</body>
</html>
